<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微醺疗愈网站 - 完美整合版</title>
    <style>
        /* === 1. 变量与全局全景背景（暗色细拉丝金属） === */
        :root {
            --primary-red: #A61D32;
            --gold-text: #B48A4E;
            --light-gold: #D2AF74; /* 提升亮度后的亮古铜金 */
            --light-bg: #E3D3C3;
            --dark-gray: #4E4E4D;
            --glow-color: #FFAE42;
            --glow-light: #FFE29E;
            
            /* CRT 荧光屏色彩 */
            --crt-bg: #031203;
            --crt-text: #33FF33;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            /* 基础深暗冷轧钢底色 */
            background-color: #151616; 
            
            /* 纯 CSS 打造的暗色细拉丝金属（Dark Brushed Metal）纹理与微颗粒感 */
            background-image: 
                linear-gradient(rgba(18, 18, 18, 0.95), rgba(30, 31, 31, 0.95)),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 1px, transparent 1px, transparent 2px),
                repeating-linear-gradient(0deg, rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 1px, transparent 1px, transparent 2px);
            
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 0;
            margin: 0;
            overflow-x: hidden;
        }

        .main-container {
            width: 1080px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        /* === 2. 上部：通感词网格区域 (Flat UI 风格) === */
        .words-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px 12px;
        }

        .word-card {
            background-color: var(--primary-red);
            border: 2px solid var(--primary-red);
            height: 70px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .word-card::before {
            content: '';
            position: absolute;
            left: 8px;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            height: 20px;
            background-color: #ffffff;
            z-index: 1;
        }

        .word-card::after {
            content: '';
            position: absolute;
            left: 14px;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            height: 20px;
            border-left: 6px solid var(--primary-red);
            border-right: 6px solid var(--primary-red);
            z-index: 2;
            pointer-events: none;
        }

        .word-card .zh-text { color: #ffffff; font-size: 13px; font-weight: bold; z-index: 3; letter-spacing: 2px; margin-top: 2px; }
        .word-card .en-text { color: var(--primary-red); font-size: 9px; font-weight: bold; z-index: 3; letter-spacing: 0.5px; margin-bottom: 2px; transform: scale(0.9); }

        .word-card.selected {
            background-color: var(--glow-color);
            border-color: var(--glow-light);
            box-shadow: 0 0 15px rgba(255, 174, 66, 0.6);
        }
        .word-card.selected::before { background-color: #FFF2D4; }
        .word-card.selected::after { border-left-color: var(--glow-color); border-right-color: var(--glow-color); }
        .word-card.selected .zh-text { color: #5C2E00; }
        .word-card.selected .en-text { color: #D36B00; }

        /* === 3. 中部：情绪旋钮与 360° 双层刻度环区域 === */
        .knobs-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .knob-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .knob-dial-container {
            width: 76px;
            height: 76px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }
        .knob-dial-container:active { cursor: grabbing; }

        .ticks-svg {
            position: absolute;
            inset: 0;
            transform: rotate(-90deg);
        }
        .ticks-svg circle { fill: none; stroke-width: 4px; }
        .ticks-bg { stroke: #4A4A4A; } /* 暗灰色默认刻度 */
        .ticks-highlight {
            stroke: #ffffff; /* 激活时的高亮白色 */
            stroke-dasharray: 0 999;
            filter: drop-shadow(0 0 3px #FFFFFF);
            transition: stroke-dasharray 0.05s linear;
        }

        .knob-core {
            width: 44px;
            height: 44px;
            background-color: var(--gold-text);
            border-radius: 50%;
            position: relative;
            z-index: 2;
            transform: rotate(0deg);
        }
        .knob-core::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 10px;
            background-color: #333;
            border-radius: 1px;
        }

        .knob-label {
            background-color: var(--gold-text);
            color: #000000;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 2px;
            min-width: 48px;
            text-align: center;
            position: relative;
        }
        .knob-label::before, .knob-label::after { content: '•'; color: #ffffff; font-size: 8px; position: absolute; top: 50%; transform: translateY(-50%); }
        .knob-label::before { left: 3px; }
        .knob-label::after { right: 3px; }

        /* === 4. 下部：双设备舱与滑出式显示屏 === */
        .devices-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 10px;
            position: relative;
        }

        .left-deck-zone { display: flex; flex-direction: column; gap: 20px; }

        .cassette-player-left {
            width: 260px;
            height: 180px;
            background-color: var(--light-bg);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .window-screen {
            width: 220px;
            height: 130px;
            background-color: #9E9E9D;
            border-radius: 6px;
            border: 3px solid #C4B5A5;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .door-flap {
            position: absolute;
            inset: 0;
            background-color: #8C8C8B;
            z-index: 5;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom;
        }
        .cassette-player-left.door-open .door-flap {
            transform: perspective(300px) rotateX(-45deg) translateY(20px);
            opacity: 0.4;
            pointer-events: none;
        }

        .tape-graphic {
            width: 170px;
            height: 95px;
            background: linear-gradient(to bottom, var(--primary-red) 35%, #FFFDF7 35%, #FFFDF7 65%, #3A3A39 65%);
            border-radius: 4px;
            border: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            position: relative;
        }
        .tape-wheel {
            width: 28px;
            height: 28px;
            background-color: #ffffff;
            border: 4px solid #333;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .tape-wheel::after { content: ''; width: 10px; height: 10px; border: 2px dashed #333; border-radius: 50%; }

        .sliding-tape {
            position: absolute;
            z-index: 4;
            opacity: 0;
            transform: translateY(-80px) scale(0.7);
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .cassette-player-left.tape-dropped .sliding-tape {
            opacity: 1;
            transform: translateY(15px) rotate(-8deg);
            pointer-events: auto;
            cursor: grab;
        }

        /* 💡 按钮样式优化：针对深色拉丝背景换为高对比度的亮色调 */
        .control-action-buttons { display: flex; gap: 30px; padding-left: 15px; }
        
        .action-btn-item { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            align-items: center; 
            font-size: 11px; 
            font-weight: bold; 
            color: #FFFFFF; /* 文本在深色背景下改为高亮纯白 */
            letter-spacing: 1px; 
        }
        
        .action-block {
            width: 70px;
            height: 26px;
            background-color: var(--light-gold); /* 改为更有质感、清晰可见的亮古铜金 */
            border-radius: 4px;
            border: 1px solid #E4C894;
            cursor: pointer;
            box-shadow: 0 3px 0 #9E7F43;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .action-block:active { 
            transform: translateY(3px); 
            box-shadow: none; 
        }

        /* 右侧部分 */
        .right-deck-wrapper { position: relative; display: flex; align-items: flex-end; }

        .cassette-deck-right {
            width: 350px;
            height: 290px;
            background-color: var(--dark-gray);
            border-radius: 12px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .right-main-window {
            width: 100%;
            height: 180px;
            background-color: #7A878C;
            border: 6px solid #3A3A39;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .right-main-window.drag-hover { background-color: #9cb1b8; border-color: var(--glow-color); }

        .right-inner-well {
            width: 100%;
            height: 100%;
            background-color: #5D686C;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .right-inner-well .tape-graphic { transform: scale(1.1); display: none; }
        .cassette-deck-right.has-tape .right-inner-well .tape-graphic {
            display: flex;
            animation: tape-insert 0.3s ease-out forwards;
        }
        .cassette-deck-right.has-tape .tape-wheel::after { animation: spin 2s linear infinite; }

        .deck-piano-keys { display: flex; gap: 10px; width: 100%; justify-content: center; }
        .piano-key {
            flex: 1;
            height: 32px;
            background-color: var(--gold-text);
            border-radius: 4px;
            border-bottom: 4px solid #8F6A34;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 12px;
        }
        .piano-key:active { border-bottom-width: 0; transform: translateY(4px); }

        /* CRT侧翼划出式显示器外壳与文本 */
        .retro-monitor-drawer {
            position: absolute;
            left: 330px;
            bottom: 10px;
            width: 0;
            height: 270px;
            background-color: #222221;
            border-radius: 0 12px 12px 0;
            overflow: hidden;
            transition: width 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex;
            align-items: center;
            padding: 0;
            z-index: 5;
            box-shadow: 5px 8px 20px rgba(0,0,0,0.3);
        }

        .right-deck-wrapper.monitor-active .retro-monitor-drawer {
            width: 420px;
            padding: 15px 15px 15px 30px;
        }

        .crt-screen {
            width: 100%;
            height: 100%;
            background-color: var(--crt-bg);
            border: 4px solid #333332;
            border-radius: 8px;
            position: relative;
            padding: 20px;
            overflow-y: auto;
            animation: crt-flicker 0.15s infinite;
        }

        .crt-screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 0, 0.04));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .crt-text-content {
            color: var(--crt-text);
            font-family: "Courier New", Courier, monospace, "SimSun";
            font-size: 14px;
            line-height: 1.6;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(51, 255, 51, 0.75);
            white-space: pre-wrap;
            z-index: 2;
            position: relative;
        }
        .crt-text-content::after { content: ' █'; color: var(--crt-text); animation: cursor-blink 0.8s infinite; }

        /* === 动画组件 === */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes tape-insert {
            0% { transform: scale(1.4) translateY(-30px); opacity: 0; }
            100% { transform: scale(1.1) translateY(0); opacity: 1; }
        }
        @keyframes crt-flicker { 0% { opacity: 0.985; } 50% { opacity: 1; } 100% { opacity: 0.99; } }
        @keyframes cursor-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="main-container">

        <!-- 1. 通感词汇网格布局板 (4行 * 6列 = 24个) -->
        <div class="words-grid" id="wordsGrid">
            <div class="word-card"><span class="zh-text">夜空</span><span class="en-text">NIGHT SKY</span></div>
            <div class="word-card"><span class="zh-text">烟雾</span><span class="en-text">SANDALWOOD</span></div>
            <div class="word-card"><span class="zh-text">青苔</span><span class="en-text">MOSS</span></div>
            <div class="word-card"><span class="zh-text">绿意</span><span class="en-text">GREENERY</span></div>
            <div class="word-card"><span class="zh-text">泥土</span><span class="en-text">EARTH</span></div>
            <div class="word-card"><span class="zh-text">朦胧</span><span class="en-text">HAZY</span></div>
            <div class="word-card"><span class="zh-text">沙漠</span><span class="en-text">BEACH</span></div>

            <div class="word-card"><span class="zh-text">肥皂</span><span class="en-text">SOAP</span></div>
            <div class="word-card"><span class="zh-text">柔软</span><span class="en-text">SOFTNESS</span></div>
            <div class="word-card"><span class="zh-text">海风</span><span class="en-text">SEA BREEZE</span></div>
            <div class="word-card"><span class="zh-text">辛辣</span><span class="en-text">SPICY</span></div>
            <div class="word-card"><span class="zh-text">凛冬</span><span class="en-text">WINTER</span></div>
            <div class="word-card"><span class="zh-text">清凉</span><span class="en-text">COOLNESS</span></div>
            <div class="word-card"><span class="zh-text">阳光</span><span class="en-text">SUNSHINE</span></div>
            <div class="word-card"><span class="zh-text">馥郁</span><span class="en-text">FRAGRANT</span></div>
            <div class="word-card"><span class="zh-text">落日</span><span class="en-text">SUNSET</span></div>
            <div class="word-card"><span class="zh-text">檀木</span><span class="en-text">SANDALWOOD</span></div>
            <div class="word-card"><span class="zh-text">硝石</span><span class="en-text">MINERAL</span></div>
            <div class="word-card"><span class="zh-text">明亮</span><span class="en-text">BRIGHTNESS</span></div>
            <div class="word-card"><span class="zh-text">安宁</span><span class="en-text">TRANQUILITY</span></div>
            <div class="word-card"><span class="zh-text">丝绒</span><span class="en-text">VELVET</span></div>
        </div>

        <!-- 2. 情绪指标控制区 (11个带双层刻度圈的动态旋钮) -->
        <div class="knobs-container" id="knobsContainer"></div>

        <!-- 3. 底层双设备硬件舱 -->
        <div class="devices-container">
            
            <!-- 左侧：取磁带机舱架 -->
            <div class="left-deck-zone">
                <div class="cassette-player-left" id="leftPlayer">
                    <div class="window-screen">
                        <div class="door-flap" id="leftDoor"></div>
                        <div class="tape-graphic sliding-tape" id="draggableTape" draggable="true">
                            <div class="tape-wheel"></div>
                            <div class="tape-wheel"></div>
                        </div>
                    </div>
                </div>
                <div class="control-action-buttons">
                    <div class="action-btn-item">
                        <span>CONFIRM</span>
                        <div class="action-block" id="confirmBtn"></div>
                    </div>
                    <div class="action-btn-item">
                        <span>RESET</span>
                        <div class="action-block" id="resetBtn"></div>
                    </div>
                </div>
            </div>

            <!-- 右侧：收纳大卡座与滑出CRT终端 -->
            <div class="right-deck-wrapper" id="rightDeckWrapper">
                <div class="cassette-deck-right" id="rightDeck">
                    <div class="right-main-window" id="dropZone">
                        <div class="right-inner-well">
                            <div class="tape-graphic" id="receiverTape">
                                <div class="tape-wheel"></div>
                                <div class="tape-wheel"></div>
                            </div>
                        </div>
                    </div>
                    <div class="deck-piano-keys">

                    </div>
                </div>

                <!-- 展开隐藏侧翼：老式绿磷 CRT 显示器 -->
                <div class="retro-monitor-drawer">
                    <div class="crt-screen">
                        <div class="crt-text-content" id="dialogueTerminal"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- === 5. 核心交互 JavaScript 控制流 === -->
    <script>
        const LABELS = ["平静", "微醺", "活力", "愉悦", "温暖", "孤独", "焦灼", "疲惫", "酸楚", "失落", "悲伤"];
        const HEALING_TEXT = "系统正在为您播放特调微醺疗愈音频。\n\n「全职妈妈的午后逃跑计划」：\n听到了吗？这是磁带摩擦磁头时特有的粗糙沙沙声，混合了你刚刚选中的肥皂与凛冬的空气。此时此刻，吸油烟机的轰鸣、孩子的哭闹、洗碗池里永远洗不完的油污，全部被隔绝在安全线之外。给自己倒一杯微甜的起泡酒，在绿磷荧光的呼吸中，允许自己不合时宜地发呆15分钟。你不仅是谁的母亲，你更是你自己。」";

        // 动态渲染 11 个带精确双层 SVG 进度线结构的情绪旋钮
        const knobsContainer = document.getElementById('knobsContainer');
        LABELS.forEach(label => {
            const wrapper = document.createElement('div');
            wrapper.className = 'knob-wrapper';
            wrapper.innerHTML = `
                <div class="knob-dial-container">
                    <svg class="ticks-svg" width="76" height="76" viewBox="0 0 80 80">
                        <circle class="ticks-bg" cx="40" cy="40" r="34" />
                        <circle class="ticks-highlight" cx="40" cy="40" r="34" />
                    </svg>
                    <div class="knob-core"></div>
                </div>
                <div class="knob-label">${label}</div>
            `;
            knobsContainer.appendChild(wrapper);
        });

        let selectedWordsCount = 0;
        let activeKnobWrapper = null;
        let knobValues = new Map();
        let typewriterTimer = null;

        // === 交互逻辑 1：通感词卡片判定 (1~3个) ===
        const wordCards = document.querySelectorAll('.word-card');
        wordCards.forEach(card => {
            card.addEventListener('click', () => {
                if (!card.classList.contains('selected')) {
                    if (selectedWordsCount >= 3) {
                        alert("通感词最多只能选择 3 个哦。");
                        return;
                    }
                    card.classList.add('selected');
                    selectedWordsCount++;
                } else {
                    card.classList.remove('selected');
                    selectedWordsCount--;
                }
            });
        });

        // === 交互逻辑 2：情绪旋钮 360° 自由旋转与全段累加点亮进度条 ===
        const dialContainers = document.querySelectorAll('.knob-dial-container');
        dialContainers.forEach(container => {
            const wrapper = container.closest('.knob-wrapper');
            const knobCore = container.querySelector('.knob-core');
            const highlightCircle = container.querySelector('.ticks-highlight');
            
            const radius = 34;
            const totalLength = 2 * Math.PI * radius; // 约为 213.6
            
            knobValues.set(wrapper, 0);
            let isDragging = false;

            container.addEventListener('mousedown', (e) => {
                if (activeKnobWrapper && activeKnobWrapper !== wrapper) {
                    alert("一次只能拧动 1 个情绪指标进行疗愈。");
                    return;
                }
                isDragging = true;
                updateRotation(e);
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                updateRotation(e);
            });

            window.addEventListener('mouseup', () => { isDragging = false; });

            function updateRotation(e) {
                const rect = container.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                const deltaX = e.clientX - centerX;
                const deltaY = e.clientY - centerY;
                
                let angleRad = Math.atan2(deltaY, deltaX);
                let angleDeg = angleRad * (180 / Math.PI) + 90; // 修正起点至正上方为0度
                
                if (angleDeg < 0) angleDeg += 360;

                // 驱动中心指针转动
                knobCore.style.transform = `rotate(${angleDeg}deg)`;
                
                const percentage = angleDeg / 360;
                knobValues.set(wrapper, percentage);

                // 累加点亮所经过的全部区域
                const activeLength = percentage * totalLength;
                highlightCircle.style.strokeDasharray = `${activeLength} ${totalLength}`;

                if (percentage > 0.01) {
                    wrapper.classList.add('activated');
                    activeKnobWrapper = wrapper;
                } else {
                    wrapper.classList.remove('activated');
                    activeKnobWrapper = null;
                }
            }
        });

        // === 交互逻辑 3：CONFIRM 校验与滑出舱门 ===
        const confirmBtn = document.getElementById('confirmBtn');
        const leftPlayer = document.getElementById('leftPlayer');
        
        confirmBtn.addEventListener('click', () => {
            const hasValidWords = (selectedWordsCount >= 1 && selectedWordsCount <= 3);
            const hasValidKnob = (activeKnobWrapper !== null && knobValues.get(activeKnobWrapper) > 0);

            if (hasValidWords && hasValidKnob) {
                leftPlayer.classList.add('door-open');
                setTimeout(() => {
                    leftPlayer.classList.add('tape-dropped');
                }, 300);
            } else {
                alert("无法生成：请确保勾选了 1~3 个通感词，并扭动了 1 个情绪旋钮！");
            }
        });

        // === 交互逻辑 4：RESET 彻底复原清空 ===
        const resetBtn = document.getElementById('resetBtn');
        const rightDeck = document.getElementById('rightDeck');
        const rightDeckWrapper = document.getElementById('rightDeckWrapper');
        const dialogueTerminal = document.getElementById('dialogueTerminal');
        
        resetBtn.addEventListener('click', () => {
            clearInterval(typewriterTimer);
            dialogueTerminal.textContent = "";

            wordCards.forEach(card => card.classList.remove('selected'));
            selectedWordsCount = 0;

            const allWrappers = document.querySelectorAll('.knob-wrapper');
            allWrappers.forEach(wrapper => {
                wrapper.classList.remove('activated');
                knobValues.set(wrapper, 0);
                wrapper.querySelector('.knob-core').style.transform = 'rotate(0deg)';
                wrapper.querySelector('.ticks-highlight').style.strokeDasharray = '0 999';
            });
            activeKnobWrapper = null;

            leftPlayer.className = 'cassette-player-left';
            rightDeck.classList.remove('has-tape');
            rightDeckWrapper.classList.remove('monitor-active');
        });

        // === 交互逻辑 5：Drag & Drop 鼠标吸附及打字机扩展联动 ===
        const draggableTape = document.getElementById('draggableTape');
        const dropZone = document.getElementById('dropZone');

        draggableTape.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', 'healing-tape');
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-hover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-hover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-hover');
            const data = e.dataTransfer.getData('text/plain');
            
            if (data === 'healing-tape') {
                leftPlayer.classList.remove('tape-dropped');
                rightDeck.classList.add('has-tape');
                
                setTimeout(() => {
                    rightDeckWrapper.classList.add('monitor-active');
                    startTypewriter(HEALING_TEXT);
                }, 400);
            }
        });

        function startTypewriter(text) {
            clearInterval(typewriterTimer);
            dialogueTerminal.textContent = "";
            let index = 0;
            
            typewriterTimer = setInterval(() => {
                if (index < text.length) {
                    dialogueTerminal.textContent += text.charAt(index);
                    index++;
                    const screenObj = dialogueTerminal.closest('.crt-screen');
                    screenObj.scrollTop = screenObj.scrollHeight;
                } else {
                    clearInterval(typewriterTimer);
                }
            }, 50);
        }
    </script>
</body>
